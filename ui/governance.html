<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Governance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260602f" />
</head>
<body data-page="governance">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Protocol Control</div>
      <h1>Governance</h1>
      <p class="muted">Active proposals, vote status, and results.</p>
    </section>
    <section class="two-col">
      <div class="card">
        <div class="label">Active Proposals</div>
        <div id="proposalList" class="list"><div class="list-item">Loading proposals...</div></div>
      </div>
      <div class="card">
        <div class="label">Vote</div>
        <form id="voteForm">
          <div class="field"><label>Proposal ID</label><input id="proposalId" placeholder="25" /></div>
          <div class="field"><label>Vote</label><select id="proposalVote"><option>YES</option><option>NO</option><option>ABSTAIN</option></select></div>
          <button class="primary" type="button">Prepare Vote</button>
        </form>
        <div class="result">Voting requires validator governance signing on the node.</div>
      </div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260602g"></script>
</body>
</html>
