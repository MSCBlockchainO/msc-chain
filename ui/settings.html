<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Wallet Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260601b" />
</head>
<body data-page="settings">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Preferences</div>
      <h1>Settings</h1>
      <p class="muted">RPC selection, theme, language, network, and navigation preferences.</p>
    </section>
    <section class="card">
      <form id="settingsForm">
        <div class="field"><label for="settingsRpc">RPC Selection</label><input id="settingsRpc" placeholder="https://mscblockexplorer.in" /></div>
        <div class="row">
          <div class="field"><label for="settingsTheme">Theme</label><select id="settingsTheme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
          <div class="field"><label for="settingsLanguage">Language</label><select id="settingsLanguage"><option>English</option><option>Hindi/Urdu</option></select></div>
          <div class="field"><label>Network</label><input value="MSC Mainnet 91938" readonly /></div>
        </div>
        <button class="primary" type="submit">Save Settings</button>
      </form>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260601b"></script>
</body>
</html>
