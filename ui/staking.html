<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Staking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260601d" />
</head>
<body data-page="staking">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Validator Economics</div>
      <h1>Staking</h1>
      <p class="muted">Delegations, rewards, stake, unstake, and claim controls.</p>
    </section>
    <section class="grid">
      <div class="card"><div class="label">Delegations</div><div id="delegations" class="value">-</div></div>
      <div class="card"><div class="label">Rewards</div><div id="rewardBalance" class="value">- MSC</div></div>
      <div class="card"><div class="label">Staked</div><div id="stakedBalance" class="value">- MSC</div></div>
    </section>
    <section class="two-col">
      <div class="card">
        <div id="stakeStatus" class="pill">Ready</div>
        <form id="stakeForm">
          <div class="field"><label for="stakeValidator">Validator ID</label><input id="stakeValidator" placeholder="F" /></div>
          <div class="field"><label for="stakePubkey">Validator Consensus Pubkey</label><input id="stakePubkey" placeholder="32-byte ed25519 pubkey hex" /></div>
          <div class="row">
            <div class="field"><label for="stakeAmount">Amount</label><input id="stakeAmount" type="number" min="1" value="100" /></div>
            <div class="field"><label for="stakeEpochs">Lock Epochs</label><input id="stakeEpochs" type="number" min="1" value="19872000" /></div>
          </div>
          <button class="primary" type="submit">Stake</button>
        </form>
      </div>
      <div class="card">
        <div id="unstakeStatus" class="pill">Ready</div>
        <form id="unstakeForm">
          <div class="field"><label for="unstakeValidator">Validator ID</label><input id="unstakeValidator" placeholder="F" /></div>
          <div class="field"><label for="unstakeAmount">Amount</label><input id="unstakeAmount" type="number" min="1" value="100" /></div>
          <button type="submit">Unstake</button>
        </form>
        <button id="claimRewards" type="button">Claim Rewards</button>
        <div id="claimStatus" class="pill">Idle</div>
      </div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260602b"></script>
</body>
</html>
