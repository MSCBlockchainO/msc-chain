<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send MSC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260602f" />
</head>
<body data-page="send">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Transfer</div>
      <h1>Send</h1>
      <p class="muted">Create, sign, and submit an MSC transaction from your unlocked browser wallet.</p>
    </section>
    <section class="card">
      <div id="sendStatus" class="pill">Ready</div>
      <form id="sendForm">
        <div class="field"><label>From</label><input id="sendFrom" readonly /></div>
        <div class="field"><label for="sendTo">Recipient Address</label><input id="sendTo" placeholder="MSC..." /></div>
        <div class="row">
          <div class="field"><label for="sendAmount">Amount</label><input id="sendAmount" type="number" min="1" value="10" /></div>
          <div class="field"><label for="sendCoin">Coin</label><input id="sendCoin" value="MSC" /></div>
        </div>
        <div class="fee-preview">
          <div><div class="label">Fee</div><strong id="sendFee">1 MSC</strong></div>
          <div><div class="label">Total</div><strong id="sendTotal">11 MSC</strong></div>
          <div><div class="label">Network</div><strong>91938</strong></div>
        </div>
        <button class="primary" type="submit">Send Transaction</button>
      </form>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260602g"></script>
</body>
</html>
