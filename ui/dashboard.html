<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Wallet Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260601d" />
</head>
<body data-page="dashboard">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">MSC Wallet</div>
      <h1>Dashboard</h1>
      <p class="muted">Balance, latest activity, network health, CMD status, and validator health.</p>
    </section>
    <section class="grid">
      <div class="card"><div class="label">Total Balance</div><div id="totalBalance" class="value">- MSC</div></div>
      <div class="card"><div class="label">USD Value</div><div id="usdValue" class="value">$-</div></div>
      <div class="card"><div class="label">Read Verification</div><div id="dashboardVerification" class="pill">SPV pending</div></div>
      <div class="card"><div class="label">Network Status</div><div id="networkStatus" class="value">-</div></div>
      <div class="card"><div class="label">CMD Status</div><div id="cmdStatus" class="value">-</div></div>
      <div class="card"><div class="label">Validator Status</div><div id="validatorStatus" class="value">-</div></div>
      <div class="card"><div class="label">Latest Blocks</div><div id="latestBlocks" class="mono">-</div></div>
    </section>
    <section class="card">
      <div class="label">Latest Transactions</div>
      <div id="latestTx" class="list"><div class="list-item">Load wallet to show transactions.</div></div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260602e"></script>
</body>
</html>
