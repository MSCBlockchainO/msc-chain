<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create MSC Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260601d" />
</head>
<body data-page="wallet">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">New Account</div>
      <h1>Create Wallet</h1>
      <p class="muted">Generate a new local MSC wallet encrypted with your password.</p>
    </section>
    <section class="card">
      <form id="createWalletForm">
        <div class="field"><label for="createPassword">Wallet Password</label><input id="createPassword" type="password" placeholder="Strong password" /></div>
        <button class="primary" type="submit">Create Wallet</button>
      </form>
      <div id="createResult" class="result mono">Wallet result will appear here.</div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260601d"></script>
</body>
</html>
