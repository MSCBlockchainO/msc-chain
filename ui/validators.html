<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Validators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260602h" />
</head>
<body data-page="validators">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Consensus</div>
      <h1>Validators</h1>
      <p class="muted">Validator list, uptime, voting power, performance, and CMD mode.</p>
    </section>
    <section class="grid">
      <div class="card"><div class="label">CMD Mode</div><div id="validatorCMD" class="value">-</div></div>
      <div class="card"><div class="label">Block Height</div><div id="blockHeight" class="value">-</div></div>
      <div class="card"><div class="label">Finalized Height</div><div id="finalizedHeight" class="value">-</div></div>
      <div class="card"><div class="label">Active Validators</div><div id="validatorActiveCount" class="value">-</div></div>
      <div class="card"><div class="label">Home-PC Nodes</div><div id="validatorHomePCCount" class="value">-</div></div>
      <div class="card"><div class="label">Founder Badges</div><div id="validatorFounderCount" class="value">-</div></div>
      <div class="card"><div class="label">Program</div><div id="validatorCampaignSeason" class="value">-</div></div>
      <div class="card"><div class="label">Program Status</div><div id="validatorCampaignStatus" class="value">-</div></div>
      <div class="card"><div class="label">Program Leader</div><div id="validatorCampaignLeader" class="value">-</div></div>
    </section>
    <section class="card">
      <div class="label">Validator Leaderboard</div>
      <div class="filter-row" id="validatorFilters">
        <button type="button" class="filter-button active" data-validator-filter="all">All</button>
        <button type="button" class="filter-button" data-validator-filter="performance">Performance</button>
        <button type="button" class="filter-button" data-validator-filter="rotation">Rotation</button>
        <button type="button" class="filter-button" data-validator-filter="standby">Standby</button>
        <button type="button" class="filter-button" data-validator-filter="home_pc">Home-PC</button>
        <button type="button" class="filter-button" data-validator-filter="founder">Founder</button>
      </div>
      <div id="validatorList" class="list"><div class="list-item">Loading validators...</div></div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260603a"></script>
</body>
</html>
