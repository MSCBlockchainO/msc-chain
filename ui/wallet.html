<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260601d" />
</head>
<body data-page="wallet">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Account</div>
      <h1>Wallet</h1>
      <p class="muted">Address, balance, assets, copy tools, QR, and key export controls.</p>
    </section>
    <section class="two-col">
      <div class="card">
        <div class="label">Wallet Address</div>
        <div id="walletAddress" class="value mono">-</div>
        <div class="label">Public Key</div>
        <div id="walletPublicKey" class="mono">-</div>
        <div class="row">
          <button id="copyAddress" type="button">Copy Address</button>
          <a class="button primary" href="send.html">Send</a>
          <a class="button" href="receive.html">Receive</a>
        </div>
      </div>
      <div class="card">
        <div class="label">Balance</div>
        <div id="walletBalance" class="value">- MSC</div>
        <div id="balanceVerification" class="pill">SPV pending</div>
        <div class="label">Assets</div>
        <div class="list">
          <div class="list-item"><strong>MSC</strong><span id="assetMSC">- MSC</span></div>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="label">Private Key Export</div>
      <button id="exportPrivateKey" type="button">Export Private Key</button>
      <div id="privateKeyOutput" class="result mono">Unlock wallet first.</div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260602b"></script>
</body>
</html>
