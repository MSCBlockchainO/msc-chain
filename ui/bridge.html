<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260601d" />
</head>
<body data-page="bridge">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Cross Chain</div>
      <h1>Bridge</h1>
      <p class="muted">Current bridge state is disabled and verification-only until governance enables asset transfer.</p>
    </section>
    <section class="grid">
      <div class="card"><div class="label">Status</div><div id="bridgeStatus" class="value">-</div></div>
      <div class="card"><div class="label">Mode</div><div id="bridgeMode" class="value">-</div></div>
      <div class="card"><div class="label">Registered Chains</div><div id="bridgeChains" class="value">-</div></div>
      <div class="card"><div class="label">Registered Assets</div><div id="bridgeAssets" class="value">-</div></div>
    </section>
    <section class="card">
      <div class="label">Future Asset Transfer</div>
      <div id="bridgeFuture" class="mono">Light-client verified transfer pending.</div>
      <button id="refreshBridge" type="button">Refresh Bridge Status</button>
    </section>
    <section class="card">
      <div class="label">Verification Test</div>
      <textarea id="bridgeProof" rows="7" placeholder='{"source_chain":"ethereum","height":0,"proof":"..."}'></textarea>
      <button id="verifyBridgeProof" class="primary" type="button">Verify Proof</button>
      <div id="bridgeResult" class="result mono">Waiting for proof.</div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260602d"></script>
</body>
</html>
