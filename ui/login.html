<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSC Wallet Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wallet_pages.css?v=20260602f" />
</head>
<body data-page="wallet">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Access</div>
      <h1>Login</h1>
      <p class="muted">Unlock an existing local wallet or import a private key.</p>
    </section>
    <section class="two-col">
      <div class="card">
        <div id="loginStatus" class="pill">Locked</div>
        <form id="unlockForm">
          <div class="field"><label for="unlockPassword">Wallet Password</label><input id="unlockPassword" type="password" placeholder="Password" /></div>
          <button class="primary" type="submit">Unlock Wallet</button>
        </form>
      </div>
      <div class="card">
        <div class="label">Import Wallet</div>
        <form id="importKeyForm">
          <div class="field"><label for="importPrivateKey">Private Key Hex</label><textarea id="importPrivateKey" rows="4" placeholder="64-byte ed25519 private key"></textarea></div>
          <div class="field"><label for="importPassword">New Password</label><input id="importPassword" type="password" placeholder="Password" /></div>
          <button type="submit">Import Private Key</button>
        </form>
      </div>
    </section>
  </main>
  <script src="vendor/nacl.min.js"></script>
  <script src="vendor/msc_crypto_fallback.js?v=20260524b"></script>
  <script src="wallet_pages.js?v=20260602f"></script>
</body>
</html>
