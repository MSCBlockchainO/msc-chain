<body data-page="address-book">
  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Contacts</div>
      <h1>Address Book</h1>
      <p class="muted">Save trusted MSC addresses locally in this browser for faster send and receive workflows.</p>
    </section>
    <section class="two-col">
      <div class="card">
        <div id="addressBookStatus" class="pill">Ready</div>
        <form id="addressBookForm">
          <div class="field"><label for="contactName">Name</label><input id="contactName" placeholder="Validator payout, exchange, friend" /></div>
          <div class="field"><label for="contactAddress">MSC Address</label><input id="contactAddress" placeholder="MSC..." /></div>
          <button class="primary" type="submit"><i data-lucide="plus-circle"></i>Save Contact</button>
        </form>
      </div>
      <div class="card">
        <div class="section-title">
          <div>
            <div class="label">Saved Contacts</div>
            <h2>Local address list</h2>
          </div>
        </div>
        <div id="addressBookList" class="list"><div class="list-item">Loading contacts.</div></div>
      </div>
    </section>
  </main>
