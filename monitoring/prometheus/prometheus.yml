global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: msc_nodes
    # Local nodes expose plain HTTP by default. Switch to https only when
    # the node is behind a TLS proxy or TLS is enabled on the RPC server.
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:26657
          - host.docker.internal:26658
          - host.docker.internal:26659
          - host.docker.internal:26660
        labels:
          required: "true"
      - targets:
          - host.docker.internal:26661
          - host.docker.internal:26662
          - host.docker.internal:26663
          - host.docker.internal:26664
          - host.docker.internal:26665
        labels:
          required: "false"
